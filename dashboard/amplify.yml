version: 1
applications:
  - appRoot: dashboard
    frontend:
      phases:
        preBuild:
          commands:
            # Ensure Node 20 LTS is active (required for Next.js 16.x)
            - nvm use --lts || nvm install 20
            - node --version
            - npm --version
            # Use npm ci for deterministic, reproducible builds from lock file
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          # Caching these dramatically reduces build time on subsequent deploys
          - node_modules/**/*
          - .next/cache/**/*