version: 1
applications:
  - appRoot: dashboard
    frontend:
      phases:
        preBuild:
          commands:
            # 1. Force exact Node 20 (bypasses the Node 22 LTS issue)
            - nvm install 20
            - nvm use 20
            - node --version
            - npm --version
            # 2. Use 'npm install' to completely bypass lockfile crash loops
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        # Next.js App Router (SSR) output
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          # Caching these dramatically reduces build time on subsequent deploys
          - node_modules/**/*
          - .next/cache/**/*